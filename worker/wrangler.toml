name = "tsnavi-relay"
main = "src/index.js"
compatibility_date = "2026-11-01"

# 의견·주행 기록 저장소 (id 는 kv namespace create 후 채움)
[[kv_namespaces]]
binding = "KV"
id = "a71be1f048cd42a59809b4ec756faa23"

# IP 당 분당 요청 제한 (Cloudflare 무료 Rate Limiting)
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# 오늘 쓴 무료 호출 수(전체 이용자 합계)를 세는 카운터 (Durable Object, 무료 요금제)
[[durable_objects.bindings]]
name = "CNT"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

# 폰 앱(TSnavi 연동) → 차 화면 TSnavi 로 차 속도를 넘기는 통로 (QR 코드 하나당 방 하나, 저장 안 함)
[[durable_objects.bindings]]
name = "LINK"
class_name = "LinkHub"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LinkHub"]
